name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: Test, lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        # Existing data-loading effects will be migrated in a separate PR.
        run: npm run lint -- --rule 'react-hooks/set-state-in-effect: off'

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
